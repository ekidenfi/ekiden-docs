      - EcInvalidSymbolStatus
      - EcCancelForNoFullFill
      - EcBySelfMatch
      - EcInCallAuctionStatus
      - EcQtyCannotBeZero
      - EcMarketOrderNoSupportTif
      - EcReachMaxTradeNum
      - EcInvalidPriceScale
      - EcBitIndexInvalid
      - EcStopBySelfMatch
