    OrderBookLevel:
      description: Order book level consisting of price and size.
      maxItems: 2
      minItems: 2
      prefixItems:
      - type: string
      - type: string
      type: array
    OrderBookSnapshot:
      description: Order book Snapshot at a specific point in time.
      properties:
        a:
          description: Ask levels
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          type: array
        b:
          description: Bid levels
          items:
            $ref: '#/components/schemas/OrderBookLevel'
          type: array
        mts:
          description: |-
            The timestamp from the matching engine when this orderbook data is produced.
            It can be correlated with T from public trade channel
          format: int64
          type: integer
        s:
          description: Symbol name
          type: string
        seq:
          format: uint64
          minimum: 0
          type: integer
        ts:
          description: The timestamp (ms) that the system generates the data
          format: int64
          type: integer
        u:
          description: Update ID, is always in sequence
          format: uint64
          minimum: 0
          type: integer
      required:
      - s
      - ts
      - b
      - a
      - u
      - seq
      - mts
      type: object
    OrderStatus:
      oneOf:
      - enum:
        - New
        - PartiallyFilled
        - Untriggered
        - Rejected
        - PartiallyFilledCanceled
        - Filled
        - Canceled
        - Triggered
        - Deactivated
        - Expired
        type: string
      - const: CancelRequested
        description: Cancel requested by user/admin/system, pending matching confirmation.
        type: string
    OrderType:
      description: 'Order type: Limit, Market.'
      enum:
      - Limit
      - Market
      type: string
    OrderbookUpdateType:
      enum:
      - snapshot
      - delta
      type: string
    Position:
      description: |-
        Position information.

        * risk_id: numeric identifier of the current risk tier your position is on for that symbol.
        * risk_limit_value: the maximum position value allowed under that tier (the tier’s limit). If your position value grows beyond this, the tier steps up (higher requirements).

        Details:
        * Meaning: Bybit enforces “risk limit tiers” to cap position value and scale maintenance margin. The tier is referenced by riskId, and its cap is riskLimitValue.
        * Effects: Higher tiers allow larger positions but increase maintenance margin and may constrain leverage.
        * Portfolio margin note: In portfolio margin mode, both fields are not meaningful and are returned as 0 (docs: “risk limit rules are invalid”).
      properties:
        adl_rank_indicator:
          $ref: '#/components/schemas/AdlRankIndicator'
          description: Auto-deleverage rank indicator.
        avg_price:
          description: Average entry price.
          type: string
        bust_price:
          description: Bankruptcy price
          type: string
        created_time:
          description: Timestamp of the first time a position was created on this symbol (ms)
          format: int64
          type: integer
        cum_funding:
          description: Net realized funding PnL accumulated for this position (receive positive, pay negative).
          type: string
        is_reduce_only:
          type: boolean
        leverage:
          description: Position leverage
          type: string
        leverage_sys_updated_time:
          default: null
          format: int64
          type:
          - integer
          - 'null'
        liq_price:
          description: Position liquidation price
          type: string
        margin_mode:
          $ref: '#/components/schemas/MarginMode'
          description: Is position cross margin or isolated margin
        mark_price:
          description: Mark price
          type: string
        mmr_sys_update_time:
          default: null
          format: int64
          type:
          - integer
          - 'null'
        position_balance:
          description: Position margin
          type: string
        position_im:
          description: Initial margin
          type: string
        position_im_by_mp:
          description: Initial margin calculated by mark price
          type: string
        position_mm:
          description: Maintenance margin
          type: string
        position_mm_by_mp:
          description: Maintenance margin calculated by mark price
          type: string
        position_status:
          $ref: '#/components/schemas/PositionStatus'
          description: Position status. Normal, Liq, Adl
        position_value:
          description: Position value
          type: string
        realized_pnl_cum:
          description: Sum of all historical Current Realized PnLs (and the latest one).
          type: string
        realized_pnl_cur:
          description: |-
            Sum of Fill Realized PnL for position of this symbol/side
            since this position was created last time
          type: string
        risk_id:
          description: Risk tier ID
          format: uint8
          maximum: 255
          minimum: 0
          type: integer
        risk_limit_value:
          description: Risk limit value
          type: string
        seq:
          description: |-
            Cross sequence, used to associate each fill and each position update
            * Different symbols may have the same seq, please use seq + symbol to check unique
          format: uint64
          minimum: 0
          type: integer
        side:
          $ref: '#/components/schemas/Side'
          description: 'Position side. Buy: long, Sell: short'
        size:
          description: Position size, always positive
          type: string
        stop_loss:
          description: Stop loss price
          type:
          - string
          - 'null'
        sub_account_address:
          type: string
        symbol:
          description: Symbol name
          type: string
        take_profit:
          description: Take profit price
          type:
          - string
          - 'null'
        trailing_stop:
          description: Trailing stop (The distance from market price)
          type:
          - string
          - 'null'
        unrealized_funding:
          description: Net unsettled funding PnL for this position (receive positive, pay negative).
          type: string
        unrealized_pnl:
          description: |-
            How much USDC an account will receive (or pay if negative)
            if the position is closed at the current MarkPrice
          type: string
        updated_time:
          description: Position data updated timestamp (ms)
          format: int64
          type: integer
      required:
      - risk_id
      - risk_limit_value
      - symbol
      - sub_account_address
      - side
      - size
      - avg_price
      - position_value
      - margin_mode
      - position_balance
      - position_status
      - leverage
      - mark_price
      - liq_price
      - bust_price
      - position_im
      - position_im_by_mp
      - position_mm
      - position_mm_by_mp
      - unrealized_pnl
      - unrealized_funding
      - realized_pnl_cur
      - realized_pnl_cum
      - cum_funding
      - adl_rank_indicator
      - is_reduce_only
      - created_time
      - updated_time
      - seq
      type: object
    PositionStatus:
      enum:
      - Normal
      - Liq
      - Adl
      type: string
    PublicTrade:
      description: A single trade entry from the public trade stream.
      properties:
        S:
