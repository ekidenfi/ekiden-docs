asyncapi: 3.0.0
info:
  title: Ekiden WebSocket API
  version: 1.0.0
  description: |
    Real-time market data and private account streams.

    ## Base URL

    | Environment | Host |
    | --- | --- |
    | Production | `wss://api.ekiden.fi` |
    | Staging | `wss://api.canton.ekiden.fi` |

    | Channel | Path | Auth |
    | --- | --- | --- |
    | Public | `/ws/public` | Not required |
    | Private | `/ws/private` | Required before private topics |

    ## Quick start

    | Step | Action |
    | --- | --- |
    | 1 | Connect to `/ws/public` or `/ws/private` |
    | 2 | **Private only:** authenticate (JWT or API key) |
    | 3 | Send `subscribe` with topic list |
    | 4 | Handle `subscribed`, then stream `event` messages |
    | 5 | Use `unsubscribe` to stop topics; `ping` / `pong` for keepalive |

    ## Authentication (private channel)

    Use **one** method immediately after connecting to `/ws/private`.

    ### JWT

    | Field | Value |
    | --- | --- |
    | `op` | `auth` |
    | `bearer` | Your JWT access token |
    | `req_id` | Optional correlation id |

    ```json
    {"op":"auth","bearer":"<token>","req_id":"1"}
    ```

    ### API key

    > WebSocket API keys use a **different** signing string than REST.

    | Step | Detail |
    | --- | --- |
    | 1 | Pick `timestamp_ms` (Unix ms) and a unique `nonce` |
    | 2 | Canonical message (UTF-8, pipes, no trailing newline): `EKIDEN_WS\|AUTH\|{timestamp_ms}\|{nonce}` |
    | 3 | Ed25519-sign with your key's private key |
    | 4 | Send `auth_api_key` on `/ws/private` |

    ```json
    {
      "op": "auth_api_key",
      "api_key": "0x...",
      "signature": "0x...",
      "timestamp_ms": 1700000000000,
      "nonce": "unique-nonce",
      "req_id": "1"
    }
    ```

    | Rule | Limit |
    | --- | --- |
    | Clock skew | ±30 s from server time |
    | Nonce | One use per API key |
    | Scopes | Key must allow requested private topics |

    ## Topics

    Dot-separated strings passed in `subscribe` / `unsubscribe` `args`.

    Topic symbols must be ASCII uppercase on subscribe (e.g. `ticker.BTC-USDC`).
    Mixed or lowercase symbols are rejected with `INVALID_TOPIC_SYMBOL_CASE`.
    Published event topics are always uppercase even when the market id uses mixed
    case (e.g. quote `USDCx`); payload `data.symbol` keeps the market's canonical
    casing.

    ### Public topics

    | Topic pattern | Example | Stream |
    | --- | --- | --- |
    | `orderbook.{depth}.{symbol}` | `orderbook.10.BTC-USDC` | Order book snapshots / deltas |
    | `trade.{symbol}` | `trade.BTC-USDC` | Public trades |
    | `ticker.{symbol}` | `ticker.BTC-USDC` | 24h ticker |
    | `kline.{interval}.{symbol}` | `kline.1m.BTC-USDC` | Candlesticks |
    | `all_liquidations.{symbol}` | `all_liquidations.BTC-USDC` | Liquidation feed |
    | `insurance_pool.{symbol}` | `insurance_pool.BTC-USDC` | Insurance pool |
    | `adl_alert.{symbol}` | `adl_alert.BTC-USDC` | ADL alerts |

    ### Private topics

    | Topic | Stream |
    | --- | --- |
    | `order` | Order updates |
    | `position` | Position updates |
    | `execution` | Fill / execution events |
    | `account_balance` | Balance updates |

    ## Message reference

    Every frame is JSON with an `op` field. Optional `req_id` correlates request/response pairs.

    ### Client → server

    | `op` | Purpose |
    | --- | --- |
    | `auth` | JWT authentication |
    | `auth_api_key` | API key authentication |
    | `subscribe` | Start topic streams |
    | `unsubscribe` | Stop topic streams |
    | `ping` | Keepalive / RTT (`ts` echoed in `pong`) |

    ```json
    {"op":"subscribe","args":["ticker.BTC-USDC"],"req_id":"2"}
    ```

    ### Server → client

    | `op` | Purpose |
    | --- | --- |
    | `auth` | Auth result |
    | `subscribed` | Subscription ack |
    | `unsubscribed` | Unsubscribe ack |
    | `pong` | Ping response |
    | `error` | Error (`message` + optional `req_id`) |
    | `event` | Stream payload |

    ### Event envelope

    ```json
    {
      "op": "event",
      "server_ts_ms": 1700000000000,
      "topic": "ticker.BTC-USDC",
      "data": { }
    }
    ```

    Order book events may also include a `type` field (snapshot vs delta). See **components → messages → Event** for payload schemas.
servers:
  production:
    host: api.ekiden.fi
    protocol: wss
    description: Production WebSocket endpoint
  staging:
    host: api.canton.ekiden.fi
    protocol: wss
    description: Staging WebSocket endpoint for testing
components:
  messages:
    AuthRequest:
      title: Auth
      description: |-
        Authenticate with a JWT bearer token.

        | Field | Required |
        | --- | --- |
        | `bearer` | Yes |
        | `req_id` | No |
      payload:
        properties:
          bearer:
            type: string
          op:
            const: auth
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - bearer
        type: object
    AuthApiKeyRequest:
      title: AuthApiKey
      description: |-
        Authenticate with an API key (Ed25519).

        **Sign:** `EKIDEN_WS|AUTH|{timestamp_ms}|{nonce}`

        | Field | Required |
        | --- | --- |
        | `api_key` | Yes |
        | `signature` | Yes |
        | `timestamp_ms` | Yes |
        | `nonce` | Yes |
        | `req_id` | No |
      payload:
        properties:
          api_key:
            type: string
          nonce:
            type: string
          op:
            const: auth_api_key
            type: string
          req_id:
            type:
            - string
            - 'null'
          signature:
            type: string
          timestamp_ms:
            format: int64
            type: integer
        required:
        - op
        - api_key
        - signature
        - timestamp_ms
        - nonce
        type: object
    SubscribeRequest:
      title: Subscribe
      description: |-
        Subscribe to one or more topics.

        ```json
        {"op":"subscribe","args":["ticker.BTC-USDC"]}
        ```
      payload:
        properties:
          args:
            items:
              $ref: '#/components/schemas/Topic'
            type: array
          op:
            const: subscribe
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - args
        type: object
    UnsubscribeRequest:
      title: Unsubscribe
      description: Unsubscribe from topics. Mirrors `subscribe` args.
      payload:
        properties:
          args:
            items:
              $ref: '#/components/schemas/Topic'
            type: array
          op:
            const: unsubscribe
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - args
        type: object
    PingRequest:
      title: Ping
      description: Keepalive probe. Server echoes `ts` in `pong`.
      payload:
        properties:
          op:
            const: ping
            type: string
          req_id:
            type:
            - string
            - 'null'
          ts:
            description: Client timestamp in Unix milliseconds (ms since epoch)
            format: uint64
            minimum: 0
            type:
            - integer
            - 'null'
        required:
        - op
        type: object
    AuthResponse:
      title: Auth
      description: Auth success/failure response.
      payload:
        properties:
          message:
            type:
            - string
            - 'null'
          op:
            const: auth
            type: string
          req_id:
            type:
            - string
            - 'null'
          success:
            type: boolean
          user_id:
            type:
            - string
            - 'null'
        required:
        - op
        - success
        type: object
    Subscribed:
      title: Subscribed
      description: Subscription acknowledgement listing active topics.
      payload:
        properties:
          args:
            items:
              $ref: '#/components/schemas/Topic'
            type: array
          op:
            const: subscribed
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - args
        type: object
    Unsubscribed:
      title: Unsubscribed
      description: Unsubscribe acknowledgement.
      payload:
        properties:
          args:
            items:
              $ref: '#/components/schemas/Topic'
            type: array
          op:
            const: unsubscribed
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - args
        type: object
    Pong:
      title: Pong
      description: Ping response. Echoes client `ts` when provided.
      payload:
        properties:
          client_ts:
            format: uint64
            minimum: 0
            type:
            - integer
            - 'null'
          op:
            const: pong
            type: string
          req_id:
            type:
            - string
            - 'null'
          server_ts:
            description: Server timestamp in Unix milliseconds (ms since epoch)
            format: uint64
            minimum: 0
            type: integer
        required:
        - op
        - server_ts
        type: object
    Error:
      title: Error
      description: Error frame with human-readable `message`. May include `req_id`.
      payload:
        properties:
          message:
            type: string
          op:
            const: error
            type: string
          req_id:
            type:
            - string
            - 'null'
        required:
        - op
        - message
        type: object
    Event:
      title: Event
      description: |-
        Streaming payload for a subscribed topic.

        Includes `server_ts_ms`, `topic`, and `data`.
      payload:
        anyOf:
        - properties:
            data:
              $ref: '#/components/schemas/OrderBookSnapshot'
            topic:
              $ref: '#/components/schemas/Topic'
            type:
              $ref: '#/components/schemas/OrderbookUpdateType'
          required:
          - topic
          - type
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/PublicTrade'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/Liquidation'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              $ref: '#/components/schemas/InsurancePoolSnapshot'
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              $ref: '#/components/schemas/AdlAlertSnapshot'
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              $ref: '#/components/schemas/TickerSnapshot'
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              $ref: '#/components/schemas/KlineSnapshot'
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/Order'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/Execution'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/Position'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        - properties:
            data:
              items:
                $ref: '#/components/schemas/AccountBalance'
              type: array
            topic:
              $ref: '#/components/schemas/Topic'
          required:
          - topic
          - data
          type: object
        properties:
          op:
            const: event
            type: string
          server_ts_ms:
            format: uint64
            minimum: 0
            type: integer
        required:
        - op
        - server_ts_ms
        type: object
  schemas:
    AccountBalance:
      description: Account-wide wallet and margin metrics.
      properties:
        account_type:
          description: Account type (e.g. Funding, Trading)
          type: string
        accrued_interest:
          description: Accrued interest
          type: string
        available_balance:
          description: The amount of an asset that can be used to open USDC Perpetual positions (USDC)
          type: string
        collateral:
          description: Non-quote collateral. Omitted when empty.
          items:
            $ref: '#/components/schemas/CollateralBalance'
          type: array
        debt:
          description: |-
            Quote owed: how far the quote balance is below zero (`vault_balance` then shows zero). The
            collateral's values above are already after haircuts. Omitted when nothing is owed.
          type:
          - string
          - 'null'
        equity:
          description: |-
            What the account is worth to liquidation, in USDC, floored at zero: the quote balance (a
            debt counted in full) plus unrealized P&L and funding plus unfrozen collateral at its
            maintenance weight. That is `maintenance_total_collateral` floored at zero when it is
            shown, and Vault Balance + Unrealized P&L + Unrealized Funding with only the quote. Funding
            accounts: the quote balance.
          type: string
        fee_asset:
          description: |-
            The first asset other than the quote in `fee_priority`. Trading accounts only; omitted
            while there is none.
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        fee_priority:
          description: |-
            The assets fees are taken from first, in order (`PUT /account/fee-priority`); then the
            quote and the other stablecoins by liquidation priority, then quote debt. A volatile asset
            pays fees only when listed here. Trading accounts only; omitted while empty.
          items:
            format: uint32
            minimum: 0
            type: integer
          type: array
        initial_total_collateral:
          description: |-
            Quote balance (a debt counted in full), unrealized PnL, funding, and weighted non-quote,
            in USDC. Trading accounts holding non-quote collateral or owing a debt only.
          type:
          - string
          - 'null'
        maintenance_total_collateral:
          description: |-
            Same total at maintenance weight, frozen collateral excluded. Present when
            `initial_total_collateral` is.
          type:
          - string
          - 'null'
        margin_balance:
          description: Same as `equity`.
          type: string
        realised_pnl_cum:
          description: Cumulative Realised P&L
          type: string
        sub_account_address:
          description: Sub-Account address (the owner of the technical vault)
          type: string
        total_order_im:
          description: Pre-occupied margin for order. Locked balance (USDC)
          type: string
        total_position_im:
          description: Sum of initial margin of all positions.
          type: string
        total_position_mm:
          description: Sum of maintenance margin for all positions, including estimated close fees.
          type: string
        unrealised_pnl:
          description: Unrealised P&L
          type: string
        unrealized_funding:
          description: Aggregated unrealized funding across all positions (USDC)
          type: string
        vault_balance:
          description: Vault Balance (USDC)
          type: string
      required:
      - sub_account_address
      - account_type
      - equity
      - vault_balance
      - margin_balance
      - available_balance
      - accrued_interest
      - total_order_im
      - total_position_im
      - total_position_mm
      - unrealised_pnl
      - unrealized_funding
      - realised_pnl_cum
      type: object
    AdlAlertSnapshot:
      properties:
        adl_mode:
          type: string
        adl_trigger_reason:
          type:
          - string
          - 'null'
        equity:
          type: string
        latest_pnl_ratio:
          type:
          - string
          - 'null'
        pool_group_id:
          type: string
        pool_id:
          type: string
        symbol:
          type: string
        updated_time:
          format: int64
          type: integer
      required:
      - pool_id
      - pool_group_id
      - symbol
      - adl_mode
      - equity
      - updated_time
      type: object
    AdlRankIndicator:
      description: Auto-deleverage rank indicator.
      enum:
      - Zero
      - One
      - Two
      - Three
      - Four
      - Five
      type: string
    CancelType:
      description: Reason/Source of the order cancellation.
      enum:
      - CancelByUser
      - CancelByAdmin
      - CancelBySystem
      - CancelByReduceOnly
      - CancelByPrepareLiq
      - CancelAllBeforeLiq
      - CancelByPrepareAdl
      - CancelAllBeforeAdl
      - CancelBySettle
      - CancelByTpSlTsClear
      - CancelBySmp
      - CancelByDcp
      - CancelByRebalance
      - CancelByOcoTpCanceledBySlTriggered
      - CancelByOcoSlCanceledByTpTriggered
      type: string
    CollateralBalance:
      properties:
        asset_id:
          format: uint32
          minimum: 0
          type: integer
        balance:
          description: Whole tokens, including the hold.
          type: string
        frozen:
          description: Whole tokens on hold.
          type: string
        initial_value:
          description: USDC. Trading accounts only.
          type:
          - string
          - 'null'
        initial_weight:
          description: |-
            Effective initial weight, e.g. `"0.98"`; `"0"` unless active and freshly priced.
            Trading accounts only.
          type:
          - string
          - 'null'
        maintenance_value:
          description: USDC. Trading accounts only.
          type:
          - string
          - 'null'
        maintenance_weight:
          description: Effective maintenance weight, e.g. `"0.99"`. Trading accounts only.
          type:
          - string
          - 'null'
        price:
          description: USDC per token, net of the oracle confidence haircut. Trading accounts only.
          type:
          - string
          - 'null'
        symbol:
          type: string
      required:
      - asset_id
      - symbol
      - balance
      - frozen
      type: object
    ConditionalOrder:
      properties:
        trigger_by:
          $ref: '#/components/schemas/TriggerBy'
          description: Last Price, Mark Price, or Index Price.
        trigger_direction:
          $ref: '#/components/schemas/TriggerDirection'
          description: Up or Down.
        trigger_price:
          description: The price level that activates the order.
          type: string
      required:
      - trigger_price
      - trigger_direction
      - trigger_by
      type: object
    CreateType:
      enum:
      - CreateByUser
      - CreateByFutureSpread
      - CreateByAdminClosing
      - CreateBySettle
      - CreateByStopOrder
      - CreateByTakeProfit
      - CreateByPartialTakeProfit
      - CreateByStopLoss
      - CreateByPartialStopLoss
      - CreateByTrailingStop
      - CreateByTrailingProfit
      - CreateByLiq
      - CreateByTakeOverPassThrough
      - CreateBySessionClose
      - CreateByAdlPassThrough
      - CreateByBlockPassThrough
      - CreateByBlockTradeMovePositionPassThrough
      - CreateByClosing
      - CreateByFGridBot
      - CloseByFGridBot
      - CreateByTWAP
      - CreateByTVSignal
      - CreateByMmRateClose
      - CreateByMartingaleBot
      - CloseByMartingaleBot
      - CreateByIceBerg
      - CreateByArbitrage
      - CreateByDdh
      - CreateByBboOrder
      type: string
    ExecType:
      description: Execution type for trade history entries.
      oneOf:
      - const: Trade
        description: Regular trade execution.
        type: string
      - const: AdlTrade
        description: Auto-deleveraging.
        type: string
      - const: Funding
        description: Funding fee.
        type: string
      - const: BustTrade
        description: Takeover liquidation.
        type: string
      - const: SessionClose
        description: Session auto-close.
        type: string
      - const: Delivery
        description: USDC futures delivery; position closed by contract delisted.
        type: string
      - const: Settle
        description: Inverse futures settlement; position closed due to delisting.
        type: string
      - const: BlockTrade
        description: Block trade.
        type: string
      - const: MovePosition
        description: Move position.
        type: string
      - const: FutureSpread
        description: Spread leg execution.
        type: string
    Execution:
      description: Single execution (trade fill) record.
      properties:
        base_fee:
          description: Flat base fee charged on order creation.
          type: string
        closed_size:
          description: Closed position size
          type:
          - string
          - 'null'
        create_type:
          anyOf:
          - $ref: '#/components/schemas/CreateType'
          - type: 'null'
          description: Order create type
        exec_id:
          description: Execution ID
          format: uuid
          type: string
        exec_price:
          description: Execution price
          type: string
        exec_qty:
          description: Execution quantity
          type: string
        exec_time:
          description: Executed timestamp (ms)
          format: int64
          type: integer
        exec_type:
          $ref: '#/components/schemas/ExecType'
          description: Execution type (e.g. Trade, Adl, Bust)
        exec_value:
          description: Executed value (price * qty)
          type: string
        fee:
          description: |-
            Signed fee in raw quote units (negative = maker rebate). Quote equivalent of `fee_legs`
            when a non-quote asset paid part of it. Empty on fills recorded before fees were stored.
          type: string
        fee_asset:
          description: Asset that paid first; the quote when the quote paid it all. Omitted when it is the quote.
          format: uint32
          minimum: 0
          type: integer
        fee_legs:
          description: Per-asset amounts that paid `fee`, in debit order; empty when the quote paid it all.
          items:
            $ref: '#/components/schemas/FeeLeg'
          type: array
        fee_rate:
          description: Trading fee rate
          type: string
        index_price:
          description: Index price at execution
          type: string
        is_maker:
          description: 'Is maker order. true: maker, false: taker'
          type: boolean
        leaves_qty:
          description: Remaining quantity not yet executed after this fill
          type: string
        mark_price:
          description: Mark price at execution
          type: string
        order_id:
          format: uuid
          type: string
        order_link_id:
          type:
          - string
          - 'null'
        order_price:
          description: Original order price
          type: string
        order_qty:
          description: Original order quantity
          type: string
        order_type:
          $ref: '#/components/schemas/OrderType'
          description: Order type. Market or Limit
        seized_legs:
          description: |-
            On a liquidation takeover, the collateral sold to clear the account's debt; omitted
            otherwise.
          items:
            $ref: '#/components/schemas/SeizedLeg'
          type: array
        seq:
          description: |-
            Cross sequence, used to associate each fill and each position update
            * The seq will be the same when conclude multiple transactions at the same time
            * Different symbols may have the same seq, please use seq + symbol to check unique
          format: uint64
          minimum: 0
          type: integer
        side:
          $ref: '#/components/schemas/Side'
          description: Side. Buy or Sell
        stop_order_type:
          anyOf:
          - $ref: '#/components/schemas/StopOrderType'
          - type: 'null'
          description: Stop order type if this was a stop order
        sub_account_address:
          type: string
        symbol:
          description: Symbol name, e.g. BTCUSDC
          type: string
      required:
      - exec_id
      - symbol
      - order_id
      - side
      - sub_account_address
      - order_price
      - order_qty
      - leaves_qty
      - order_type
      - exec_price
      - exec_qty
      - exec_value
      - exec_type
      - exec_time
      - is_maker
      - fee_rate
      - base_fee
      - mark_price
      - index_price
      - seq
      type: object
    FeeLeg:
      description: One asset's share of a fill's fee.
      properties:
        amount:
          description: Raw units of this asset.
          type: string
        asset_id:
          format: uint32
          minimum: 0
          type: integer
        quote_equivalent:
          description: Raw quote units of `fee` this leg covered.
          type: string
      required:
      - asset_id
      - amount
      - quote_equivalent
      type: object
    InsurancePoolInventoryPosition:
      properties:
        avg_entry_price:
          type: string
        side:
          $ref: '#/components/schemas/Side'
        size:
          type: string
        symbol:
          type: string
        unrealized_pnl:
          type: string
      required:
      - symbol
      - side
      - size
      - avg_entry_price
