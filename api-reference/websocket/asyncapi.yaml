                type: string
            required:
            - trigger_price
            - limit_price
            - trigger_by
            type: object
        required:
        - limit
        type: object
    TriggerBy:
      enum:
      - LastPrice
      - IndexPrice
      - MarkPrice
      type: string
    TriggerDirection:
      enum:
      - Up
      - Down
      type: string
channels:
  public:
    title: Public
    description: |-
      Market data streams — order book, trades, tickers, klines.

      **Path:** `/ws/public`

      No authentication required.
    address: /ws/public
    messages:
      SubscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
      UnsubscribeRequest:
        $ref: '#/components/messages/UnsubscribeRequest'
      PingRequest:
        $ref: '#/components/messages/PingRequest'
      Subscribed:
        $ref: '#/components/messages/Subscribed'
      Unsubscribed:
        $ref: '#/components/messages/Unsubscribed'
      Pong:
        $ref: '#/components/messages/Pong'
      Error:
        $ref: '#/components/messages/Error'
      Event:
        $ref: '#/components/messages/Event'
  private:
    title: Private
    description: |-
      Account streams — orders, positions, executions, balances.

      **Path:** `/ws/private`

      Authenticate with JWT or API key before subscribing.
    address: /ws/private
    messages:
      AuthRequest:
        $ref: '#/components/messages/AuthRequest'
      AuthApiKeyRequest:
        $ref: '#/components/messages/AuthApiKeyRequest'
      AuthResponse:
        $ref: '#/components/messages/AuthResponse'
      SubscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
      UnsubscribeRequest:
        $ref: '#/components/messages/UnsubscribeRequest'
      PingRequest:
        $ref: '#/components/messages/PingRequest'
      Subscribed:
        $ref: '#/components/messages/Subscribed'
      Unsubscribed:
        $ref: '#/components/messages/Unsubscribed'
      Pong:
        $ref: '#/components/messages/Pong'
      Error:
        $ref: '#/components/messages/Error'
      Event:
        $ref: '#/components/messages/Event'
operations:
  sendSubscribe:
    action: receive
    channel:
      $ref: '#/channels/public'
    messages:
    - $ref: '#/channels/public/messages/SubscribeRequest'
  sendUnsubscribe:
    action: receive
    channel:
      $ref: '#/channels/public'
    messages:
    - $ref: '#/channels/public/messages/UnsubscribeRequest'
  sendPing:
    action: receive
    channel:
      $ref: '#/channels/public'
    messages:
    - $ref: '#/channels/public/messages/PingRequest'
  receiveSubscribed:
    action: send
    channel:
