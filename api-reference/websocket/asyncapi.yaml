        - GTD
        type: object
      - const: Day
        description: Good For Day
        type: string
    Topic:
      description: Subscription topic string (e.g. 'ticker.BTC-USDC', 'orderbook.10.BTC-USDC', 'insurance_pool.BTC-USDC', 'position'). Symbol segments must be ASCII uppercase on subscribe; published event topics are always uppercase.
      examples:
      - orderbook.10.BTC-USDC
      - trade.BTC-USDC
      - ticker.BTC-USDC
      - kline.1m.BTC-USDC
      - all_liquidations.BTC-USDC
      - insurance_pool.BTC-USDC
      - adl_alert.BTC-USDC
      - order
      - position
      - execution
      - account_balance
      pattern: ^(orderbook\.[^.]+\.[^.]+|trade\.[^.]+|ticker\.[^.]+|kline\.[^.]+\.[^.]+|all_liquidations\.[^.]+|insurance_pool\.[^.]+|adl_alert\.[^.]+|order|position|execution|account_balance)$
      type: string
